<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دروس السنة الثانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F1;--surface:#FFFFFF;--ink:#1C2624;--muted:#5C6964;--line:#D6DCD5;--accent:#24584C;--gold:#9C7A33;--track:#E3E8E2;
  --p1a:#EEEDFE;--p1b:#CECBF6;--p1c:#7F77DD;--p1d:#3C3489;
  --p2a:#FAECE7;--p2b:#F5C4B3;--p2c:#D85A30;--p2d:#712B13;
  --p3a:#E1F5EE;--p3b:#9FE1CB;--p3c:#1D9E75;--p3d:#085041;
  --p4a:#FAEEDA;--p4b:#FAC775;--p4c:#BA7517;--p4d:#633806;
  --p5a:#FBEAF0;--p5b:#F4C0D1;--p5c:#D4537E;--p5d:#72243E;
  --rootbg:#1C2624;--rootfg:#F4F5F1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121816;--surface:#1A2220;--ink:#E6ECE8;--muted:#9BA9A4;--line:#2D3936;--accent:#82C3B0;--gold:#D3B46D;--track:#2A3532;
    --p1a:#26215C;--p1b:#3C3489;--p1c:#7F77DD;--p1d:#CECBF6;
    --p2a:#4A1B0C;--p2b:#712B13;--p2c:#D85A30;--p2d:#F5C4B3;
    --p3a:#04342C;--p3b:#085041;--p3c:#1D9E75;--p3d:#9FE1CB;
    --p4a:#412402;--p4b:#633806;--p4c:#BA7517;--p4d:#FAC775;
    --p5a:#4B1528;--p5b:#72243E;--p5c:#D4537E;--p5d:#F4C0D1;
    --rootbg:#E6ECE8;--rootfg:#121816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816;--surface:#1A2220;--ink:#E6ECE8;--muted:#9BA9A4;--line:#2D3936;--accent:#82C3B0;--gold:#D3B46D;--track:#2A3532;
  --p1a:#26215C;--p1b:#3C3489;--p1c:#7F77DD;--p1d:#CECBF6;
  --p2a:#4A1B0C;--p2b:#712B13;--p2c:#D85A30;--p2d:#F5C4B3;
  --p3a:#04342C;--p3b:#085041;--p3c:#1D9E75;--p3d:#9FE1CB;
  --p4a:#412402;--p4b:#633806;--p4c:#BA7517;--p4d:#FAC775;
  --p5a:#4B1528;--p5b:#72243E;--p5c:#D4537E;--p5d:#F4C0D1;
  --rootbg:#E6ECE8;--rootfg:#121816;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic","Arial",sans-serif;font-size:17px;line-height:1.7;letter-spacing:0}
button{font:inherit;letter-spacing:0;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;color:var(--muted);margin-bottom:6px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.crumbs span.sep{opacity:.6}
h1{font-family:"Amiri",serif;font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.25;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:16px}
.act{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 18px;font-size:16px}
.act:disabled{opacity:.55;cursor:progress}
.acts{display:flex;gap:10px;flex-wrap:wrap}

.spine{list-style:none;margin:0;padding:0 26px 0 0;position:relative}
.spine::before{content:"";position:absolute;right:6px;top:22px;bottom:22px;border-right:2px solid var(--line)}
.spine li{position:relative}
.spine li::before{content:"";position:absolute;right:-26px;top:50%;width:20px;border-top:2px solid var(--line)}
.spine li::after{content:"";position:absolute;right:-24px;top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.spine li.cur::after{background:var(--gold)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 18px;margin:0 0 10px}
button.row:hover{border-color:var(--accent)}
.row .nm{display:block;font-family:"Amiri",serif;font-size:24px;font-weight:700;line-height:1.35}
.row .meta{display:block;font-size:14px;color:var(--muted)}
.prog{flex:0 0 150px;text-align:left}
.prog .num{font-size:15px;color:var(--ink);white-space:nowrap}
.prog .num b{font-weight:600;font-size:18px}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.row.todo{border-style:dashed;background:transparent;cursor:default}
.row.todo .nm{color:var(--muted);font-size:21px}
.tag{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 9px;white-space:nowrap}
.tag.ok{color:var(--accent);border-color:var(--accent)}
.sumline{display:flex;align-items:center;gap:14px;margin:0 0 18px;color:var(--muted);font-size:15px}
.sumline .bar{flex:0 0 180px;margin:0}
.note{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px 20px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tb{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 13px;font-size:14.5px;color:var(--ink)}
.tb:hover{border-color:var(--accent)}
.tb.main{border-color:var(--accent);color:var(--accent)}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14.5px;margin:0 0 12px;color:var(--muted)}
.trail button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.trail .here{color:var(--ink);font-weight:600}
.branches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-size:14.5px;color:var(--muted)}
.chip{border:1px solid var(--bd);background:var(--f50);color:var(--tx);border-radius:999px;padding:2px 13px;font-size:14px}
.chip:hover{background:var(--f100)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 18px;overflow-x:auto}
.map{width:max-content;min-width:100%;font-size:14px;line-height:1.6}
.n{display:flex;align-items:center}
.lw{display:flex;align-items:center;gap:4px}
.c{display:flex;flex-direction:column;gap:7px;margin-right:18px;padding-right:18px}
.c>.n{position:relative}
.c>.n::before{content:"";position:absolute;right:-18px;top:50%;width:18px;border-top:1.5px solid var(--bd,var(--line))}
.c>.n::after{content:"";position:absolute;right:-18px;top:-4px;bottom:-4px;border-right:1.5px solid var(--bd,var(--line))}
.c>.n:first-child::after{top:50%}
.c>.n:last-child::after{bottom:50%}
.c>.n:only-child::after{display:none}
.root-c{gap:16px}
.root-c>.n::before,.root-c>.n::after{border-color:var(--muted)!important;opacity:.6}
.root-c>.n::after{top:-8px;bottom:-8px}
.root-c>.n:first-child::after{top:50%}
.root-c>.n:last-child::after{bottom:50%}
.l{display:block;text-align:right;padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--f50);color:var(--tx);max-width:290px;white-space:pre-line;font-size:inherit;line-height:inherit}
.l.h{background:var(--f100);font-weight:600;font-size:15px}
.l.x{border-style:dashed;background:transparent}
.l.r{background:var(--rootbg);color:var(--rootfg);border-color:var(--rootbg);font-family:"Amiri",serif;font-weight:700;font-size:19px;padding:10px 18px;text-align:center}
button.l.tg{cursor:pointer}
button.l.tg:hover{filter:brightness(.97)}
.ind{display:inline-block;margin-right:7px;min-width:15px;height:15px;line-height:14px;text-align:center;border:1px solid currentColor;border-radius:50%;font-size:13px;font-weight:400;vertical-align:1px;opacity:.75}
.fb{flex:0 0 auto;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:6px;color:var(--tx);opacity:.55;padding:0}
.fb:hover{opacity:1;background:var(--f100)}
.b1{--f50:var(--p1a);--f100:var(--p1b);--bd:var(--p1c);--tx:var(--p1d)}
.b2{--f50:var(--p2a);--f100:var(--p2b);--bd:var(--p2c);--tx:var(--p2d)}
.b3{--f50:var(--p3a);--f100:var(--p3b);--bd:var(--p3c);--tx:var(--p3d)}
.b4{--f50:var(--p4a);--f100:var(--p4b);--bd:var(--p4c);--tx:var(--p4d)}
.b5{--f50:var(--p5a);--f100:var(--p5b);--bd:var(--p5c);--tx:var(--p5d)}
.root-c>.n>.lw>.l.h{font-size:16px}

#stage{position:absolute;left:-30000px;top:0}
.paper{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#1C2624;--muted:#5C6964;--line:#D6DCD5;--accent:#24584C;--gold:#9C7A33;
  --p1a:#EEEDFE;--p1b:#CECBF6;--p1c:#7F77DD;--p1d:#3C3489;
  --p2a:#FAECE7;--p2b:#F5C4B3;--p2c:#D85A30;--p2d:#712B13;
  --p3a:#E1F5EE;--p3b:#9FE1CB;--p3c:#1D9E75;--p3d:#085041;
  --p4a:#FAEEDA;--p4b:#FAC775;--p4c:#BA7517;--p4d:#633806;
  --p5a:#FBEAF0;--p5b:#F4C0D1;--p5c:#D4537E;--p5d:#72243E;
  --rootbg:#1C2624;--rootfg:#FFFFFF;
  direction:rtl;background:#fff;color:#1C2624;padding:36px 44px 30px;width:max-content;min-width:1000px;
  font-family:"Noto Naskh Arabic","Amiri",serif;letter-spacing:0
}
.paper.phead{padding-bottom:6px}
.paper.pbody{padding-top:18px}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #1C2624;padding-bottom:10px;gap:40px}
.ph .t1{font-family:"Amiri",serif;font-size:30px;font-weight:700}
.ph .t2{font-size:17px;color:#5C6964}
.pf{margin-top:22px;border-top:1px solid #D6DCD5;padding-top:8px;font-size:13px;color:#5C6964;text-align:left}

.fgroup{margin:0 0 16px}
.flabel{font-size:14.5px;color:var(--muted);margin:0 0 6px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 14px;font-size:15px}
.fchip small{margin-right:9px;padding:0 8px;border-radius:999px;background:var(--track);font-size:12.5px;line-height:1.6;color:var(--muted);display:inline-block}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fchip.on small{background:rgba(255,255,255,.24);color:var(--surface);opacity:1}
.fchip.off{opacity:.45}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.extitle{font-weight:600}
.exbtns{display:flex;gap:8px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.exrow:hover{border-color:var(--accent)}
.exrow input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.extxt{flex:1;min-width:0}
.exnm{display:block;font-weight:600;font-size:17px}
.exsub{display:block;font-size:14.5px;color:var(--muted)}
.exfoot{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.exfmt{display:flex;gap:16px;flex-wrap:wrap}
.fmt{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.fmt input{accent-color:var(--accent)}
.act.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:600px){.wrap{padding:20px 14px 50px}.row .nm{font-size:21px}.prog{flex-basis:110px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <nav class="crumbs" id="crumbs" aria-label="المسار"></nav>
      <h1 id="title">دروس السنة الثانية</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="acts" id="actions"></div>
  </div>
  <main id="view"></main>
</div>
<div id="stage" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const ROOT_TITLE = "دروس السنة الثانية";
/* الأسبوع الحالي: الأسبوع 5 يبدأ يوم الأحد 8 نوفمبر 2026، ثم يزيد الرقم كل 7 أيام حتى آخر أسبوع في السنة */
const WEEK_REF = {week:5, y:2026, m:10, d:8};
const LAST_WEEK = 30;

/* weeks: أسبوع كل درس إلى حدود الأسبوع 5، وبعده يضاف درس واحد لكل أسبوع تلقائيا.
   tashjirs: التشجيرات المنجزة بحسب رقم الدرس. [النص، النوع، الفروع]؛ النوع h عنوان، x مثال */
const SUBJECTS = [
  {id:"usul", name:"أصول الفقه", weeks:[1,2,3,4,5], tashjirs:{
    1:{title:"المبادئ العشرة لعلم أصول الفقه", tree:[
      ["حده","h",[["هو علم يبحث في","h",[["أدلة الفقه الإجمالية"],["طرق الاستفادة منها"],["حال المستفيد"]]]]],
      ["موضوعه","h",[["الأدلة الإجمالية التي توصل إلى الأحكام الشرعية","h",[["مبحث الجمع بين الأدلة"],["مبحث الترجيح"],["مباحث الإسناد"],["مبحث الاجتهاد","h",[["تعريف الاجتهاد"],["أحوال المجتهد"],["شروط الاجتهاد"]]]]]]],
      ["ثمرته","h",[["القدرة على استنباط الأحكام الشرعية من أدلتها"],["القدرة على فهم كيف يعمل المجتهد"],["القدرة على القراءة في كتب الفقه وكتب التفسير"],["الشعور بنحو من الثقة في العلوم الشرعية"]]],
      ["نسبته","h",[["هو من العلوم الشرعية"],["يبنى عليه الفقه","h",[["أصول الفقه هو الأساس الذي يبنى عليه الفقه، ثم تستخرج القواعد الفقهية من الفقه"]]]]],
      ["شرفه","h",[["من شرف موضوعه"]]],
      ["فضله","h",[["ثابت مما ورد في الحث على التفقه في الدين","h",[["ما ثبت من الفضل للفقه هو ثابت لأصول الفقه"]]]]],
      ["واضعه","h",[["الإمام محمد بن إدريس الشافعي المطلبي، المتوفى سنة 204 هـ","h",[["من خلال كتابه «الرسالة»"]]]]],
      ["استمداده","h",[["مستمد من","h",[["علم التوحيد: لأن الأحكام الشرعية متوقفة على معرفة الله تعالى ومعرفة صدق النبوة"],["علم اللغة العربية: لأن حقيقة هذا العلم هي معرفة دلالات الألفاظ"],["علم الأحكام الشرعية: لا بد من معرفة قدر من الأحكام قبل معرفة أصول الفقه"]]]]],
      ["حكمه","h",[["هو فرض كفاية","h",[["إلا أنه يتعين على من تأهل للاجتهاد أو الفتوى"]]]]],
      ["مسائله","h",[["المقدمات","h",[["الأدلة الإجمالية","h",[["دليل الكتاب والمباحث اللفظية"],["السنة، الإسناد، الإجماع، القياس"],["الأدلة الخلافية، العلة، التعارض والترجيح"],["مبحث الاجتهاد والفتوى"]]]]]]]
    ]},
    3:{title:"تعريف الأحكام التكليفية: الواجب", tree:[
      ["الأقسام التكليفية الخمسة","h",[["الوجوب"],["المندوب"],["المباح"],["المكروه"],["المحرم"]]],
      ["الواجب","h",[
        ["تعريفه","h",[
          ["ما يثاب على فعله ويعاقب على تركه (الشيء المطلوب)"],
          ["من صلى يثاب على صلاته، ومن تركها يعاقب","x"],
          ["ما ذكره الأصوليون","h",[["الثواب لا يحصل إلا بالنية والقصد"],["التارك للواجب قد لا يعاقب: يستحق العقاب على تركه، وقد يغفر الله له لكثرة حسناته أو يشفع له"]]]
        ]],
        ["أقسامه","h",[
          ["تقسيم يتعلق بالواجب","h",[
            ["واجب معين: هو الأكثر (الصلاة، الصيام، بر الوالدين...)"],
            ["واجب مبهم: أن يكون الواجب واحدا من خصال متعددة، فما فعل المكلف منها أجزأ عن غيره"],
            ["كفارة اليمين: المكفر مخير فيما بينها","x"]]],
          ["تقسيم يتعلق بوقت الفعل","h",[
            ["الواجب الواسع: يكون وقته الذي عين له أوسع وأطول من زمن فعله"],
            ["صلاة الظهر: وقتها من الزوال إلى وقت العصر، وتصلى في دقائق","x"],
            ["الواجب المضيق: ما تعلق به زمن مخصوص لا يزيد فيه توقيت الواجب على زمن فعله"],
            ["الصيام","x"]]],
          ["تقسيم يتعلق بالفاعل","h",[
            ["واجب عيني: مطلوب وقوع الفعل من المكلف نفسه"],
            ["الصلوات الخمس واجبة على التعيين، وأغلب العبادات فروض عينية","x"],
            ["واجب كفائي: إذا فعله بعض المكلفين سقطت المحاسبة عن غيرهم"],
            ["صلاة الجنازة: إذا لم يوجد من يصلي على الميت فالجميع يحاسبون","x"]]]
        ]]
      ]],
      ["خلاصة الواجب","h",[
        ["هو ما طلب الشارع فعله فعلا جازما (تعريف مبني على القسمة المعرفة بالحكم)"],
        ["هو ما يثاب على فعله امتثالا ويستحق العقاب على تركه (تعريف مبني على أثر الفعل)"],
        ["الفرض مرادف للواجب"]]]
    ]},
    4:{title:"تعريف الأحكام التكليفية (تتمة): المباح", tree:[
      ["تعريفه","h",[["هو ما لا يعاقب على تركه ولا يثاب على فعله"]]],
      ["أسماؤه","h",[["المأذون فيه"],["الجائز"]]],

const $ = id => document.getElementById(id);
function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function currentWeek(){
  const t=new Date();
  const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());
  const b=Date.UTC(WEEK_REF.y,WEEK_REF.m,WEEK_REF.d);
  const w=WEEK_REF.week+Math.floor((a-b)/604800000);
  return Math.min(LAST_WEEK,Math.max(WEEK_REF.week,w));
}
function lessonsOf(s){
  const ws=s.weeks.slice();
  for(let w=WEEK_REF.week+1;w<=currentWeek();w++)ws.push(w);
  return ws.map((w,i)=>({no:i+1,week:w,t:s.tashjirs[i+1]||null}));
}
function stats(s){const L=lessonsOf(s);return {total:L.length,done:L.filter(x=>x.t).length};}
function overall(){return SUBJECTS.reduce((a,s)=>{const x=stats(s);return {total:a.total+x.total,done:a.done+x.done};},{total:0,done:0});}
function lessonLabel(s,l){return s.name+"، الدرس "+l.no;}
function firstLine(t){return t.split("\n")[0];}

/* ---------- arbre ---------- */
const SVG_FOCUS='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function nodeAt(root,path){let n=root;for(const i of path)n=n[2][i];return n;}

function buildNode(node,path,ui){
  const [text,kind,kids]=node;
  const has=!!(kids&&kids.length);
  const key=path.join(".");
  const n=el("div","n"+(path.length===1&&!ui.isFocusRoot?" b"+((path[0]%5)+1):""));
  const lw=el("div","lw");
  const cls="l"+(kind?" "+kind:"");
  if(ui.interactive&&has){
    const open=!ui.collapsed.has(key);
    const b=el("button",cls+" tg",text);
    b.setAttribute("aria-expanded",open?"true":"false");
    b.appendChild(el("span","ind",open?"−":"+"));
    b.onclick=()=>{ui.collapsed.has(key)?ui.collapsed.delete(key):ui.collapsed.add(key);ui.redraw();};
    lw.appendChild(b);
    const f=el("button","fb");f.innerHTML=SVG_FOCUS;f.title="عرض هذا الفرع وحده";f.setAttribute("aria-label","عرض هذا الفرع وحده");
    f.onclick=()=>{ui.focus(path);};
    lw.appendChild(f);
  } else lw.appendChild(el("div",cls,text));
  n.appendChild(lw);
  if(has&&!(ui.interactive&&ui.collapsed.has(key))){
    const c=el("div","c");
    kids.forEach((k,i)=>c.appendChild(buildNode(k,path.concat(i),ui)));
    n.appendChild(c);
  }
  return n;
}

/* l'arbre affiché: racine (ou branche ciblée) + enfants */
function buildMap(rootNode,path,ui){
  const map=el("div","map");
  const top=el("div","n"+(path.length?" b"+((path[0]%5)+1):""));
  const lw=el("div","lw");lw.appendChild(el("div","l r",rootNode[0]));top.appendChild(lw);
  const kids=rootNode[2]||[];
  if(kids.length){
    const c=el("div","c root-c");
    kids.forEach((k,i)=>{
      const p=path.concat(i);
      const sub=buildNode(k,p,Object.assign({},ui,{isFocusRoot:false}));
      if(path.length)sub.classList.add("b"+((path[0]%5)+1));
      c.appendChild(sub);
    });
    top.appendChild(c);
  }
  map.appendChild(top);
  return map;
}

function viewLesson(s,l){
  crumbs([{label:ROOT_TITLE,hash:""},{label:s.name,hash:s.id},{label:"الدرس "+l.no}]);
  $("title").textContent=l.t.title;
  $("subtitle").textContent=s.name+"، الدرس "+l.no+"، الأسبوع "+l.week;
  actions([{label:"تحميل PDF",run:b=>exportPdf([[s,l]],s.name+" - الدرس "+l.no+".pdf",b)}]);

  const ROOT=[s.name+"\nالدرس "+l.no,"r",l.t.tree];
  let focus=[]; const collapsed=new Set();
  const view=$("view"); view.replaceChildren();
  const tools=el("div","tools"), trail=el("div","trail"), branches=el("div","branches"), box=el("div","mapbox"), pager=el("div","pager");
  view.append(tools,trail,branches,box,pager);

  const ui={interactive:true,collapsed,redraw:()=>draw(),focus:p=>{focus=p;collapsed.clear();draw();}};

  function tb(label,fn,main){const b=el("button","tb"+(main?" main":""),label);b.onclick=fn;return b;}
  function draw(){
    const cur=nodeAt(ROOT,focus);
    box.replaceChildren(buildMap(cur,focus,ui));

    tools.replaceChildren();
    tools.appendChild(tb("فتح الكل",()=>{collapsed.clear();draw();}));
    tools.appendChild(tb("طي الكل",()=>{(cur[2]||[]).forEach((k,i)=>{if(k[2]&&k[2].length)collapsed.add(focus.concat(i).join("."));});draw();}));
    if(focus.length){
      tools.appendChild(tb("درجة للأعلى",()=>{focus=focus.slice(0,-1);collapsed.clear();draw();}));
      tools.appendChild(tb("الرجوع إلى الأصل",()=>{focus=[];collapsed.clear();draw();},true));
    }

    trail.replaceChildren();
    if(focus.length){
      const first=el("button",null,"الأصل: "+s.name);first.onclick=()=>{focus=[];collapsed.clear();draw();};trail.appendChild(first);
      focus.forEach((_,i)=>{
        trail.appendChild(el("span",null,"‹"));
        const node=nodeAt(ROOT,focus.slice(0,i+1)), label=firstLine(node[0]);
        if(i===focus.length-1)trail.appendChild(el("span","here",label));
        else{const b=el("button",null,label);b.onclick=()=>{focus=focus.slice(0,i+1);collapsed.clear();draw();};trail.appendChild(b);}
      });
      trail.style.display="";
    } else trail.style.display="none";

    branches.replaceChildren();
    const sel=(cur[2]||[]).map((k,i)=>[k,i]).filter(x=>x[0][2]&&x[0][2].length);
    if(sel.length){
      branches.appendChild(el("span",null,"اعرض فرعا وحده:"));
      sel.forEach(([k,i])=>{
        const p=focus.concat(i);
        const c=el("button","chip b"+((p[0]%5)+1),firstLine(k[0]));
        c.onclick=()=>{focus=p;collapsed.clear();draw();window.scrollTo(0,0);};
        branches.appendChild(c);
      });
      branches.style.display="";
    } else branches.style.display="none";
  }
  draw();

  const done=lessonsOf(s).filter(x=>x.t);
  const idx=done.findIndex(x=>x.no===l.no);
  pager.replaceChildren();
  const prev=done[idx-1], next=done[idx+1];
  pager.appendChild(prev?tb("‹ الدرس "+prev.no+": "+prev.t.title,()=>{location.hash=s.id+"-"+prev.no}):el("span"));
  pager.appendChild(next?tb("الدرس "+next.no+": "+next.t.title+" ›",()=>{location.hash=s.id+"-"+next.no}):el("span"));
}

/* ---------- تحديد وتحميل: تصفية حسب المادة والأسبوع ثم اختيار الدروس ---------- */
const EX={subjects:new Set(),weeks:new Set(),picked:new Set(),format:"pdf"};
const exKey=(s,l)=>s.id+":"+l.no;
function exFiltered(skipS,skipW){return allPairs().filter(p=>(skipS||EX.subjects.size===0||EX.subjects.has(p[0].id))&&(skipW||EX.weeks.size===0||EX.weeks.has(p[1].week)));}
function exReset(){EX.picked=new Set(exFiltered().map(p=>exKey(p[0],p[1])));}
function exSelected(){return exFiltered().filter(p=>EX.picked.has(exKey(p[0],p[1])));}
function exName(sel){
  if(sel.length===1)return sel[0][0].name+" - الدرس "+sel[0][1].no;
  const subs=[...new Set(sel.map(p=>p[0].name))];
  const ws=[...new Set(sel.map(p=>p[1].week))].sort((a,b)=>a-b);
  const a=subs.length===1?subs[0]:(subs.length===SUBJECTS.length?"كل المواد":subs.length+" مواد");
  const b=ws.length===1?"الأسبوع "+ws[0]:(ws.length>3?"الأسابيع "+ws[0]+" إلى "+ws[ws.length-1]:"الأسابيع "+ws.join(" و"));
  return "تشجيرات - "+a+" - "+b;
}
function exChip(label,count,on,off,fn){

function exGroup(title,chips){

function updateExFoot(){

}
function viewExport(pre){
  crumbs([{label:ROOT_TITLE,hash:""},{label:"تحديد وتحميل"}]);
  $("title").textContent="تحديد وتحميل التشجيرات";
  $("subtitle").textContent="اختر المادة والأسبوع، ثم حدد الدروس التي تريد تحميلها";

  EX.subjects=new Set(pre&&SUBJECTS.some(x=>x.id===pre)?[pre]:[]);

}
function drawEx(){
  const v=$("view");v.replaceChildren();
  const subjCounts=exFiltered(true,false);
  const sc=[exChip("الكل",subjCounts.length,EX.subjects.size===0,false,()=>{EX.subjects.clear();exReset();drawEx();})];
  SUBJECTS.forEach(s=>{
    const n=subjCounts.filter(p=>p[0].id===s.id).length, on=EX.subjects.has(s.id);
    sc.push(exChip(s.name,n,on,n===0&&!on,()=>{on?EX.subjects.delete(s.id):EX.subjects.add(s.id);exReset();drawEx();}));
  });
  v.appendChild(exGroup("المادة",sc));
  const weekCounts=exFiltered(false,true), cw=currentWeek();
  const wc=[exChip("الكل",weekCounts.length,EX.weeks.size===0,false,()=>{EX.weeks.clear();exReset();drawEx();})];
  for(let w=1;w<=cw;w++){
    const n=weekCounts.filter(p=>p[1].week===w).length, on=EX.weeks.has(w);
    wc.push(exChip("الأسبوع "+w,n,on,n===0&&!on,()=>{on?EX.weeks.delete(w):EX.weeks.add(w);exReset();drawEx();}));
  }
  v.appendChild(exGroup("الأسبوع",wc));

  const items=exFiltered();
  const head=el("div","exhead");
  head.appendChild(el("span","extitle","التشجيرات المطابقة: "+items.length));
  const bt=el("div","exbtns");
  const all=el("button","tb","تحديد الكل");all.onclick=()=>{exReset();drawEx();};
  const none=el("button","tb","إلغاء التحديد");none.onclick=()=>{EX.picked=new Set();drawEx();};
  bt.append(all,none);head.appendChild(bt);v.appendChild(head);

  if(!items.length){v.appendChild(el("p","note","لا توجد تشجيرات تطابق هذا الاختيار. غير المادة أو الأسبوع."));}
  const list=el("ul","exlist");
  items.forEach(([s,l])=>{
    const k=exKey(s,l), li=el("li"), lab=el("label","exrow");
    const cb=el("input");cb.type="checkbox";cb.checked=EX.picked.has(k);
    cb.onchange=()=>{cb.checked?EX.picked.add(k):EX.picked.delete(k);updateExFoot();};
    const t=el("span","extxt");t.appendChild(el("span","exnm",s.name+"، الدرس "+l.no));t.appendChild(el("span","exsub",l.t.title));
    lab.append(cb,t,el("span","tag","الأسبوع "+l.week));
    li.appendChild(lab);list.appendChild(li);
  });
  v.appendChild(list);

  const foot=el("div","exfoot"), fm=el("div","exfmt");
  [["pdf","ملف PDF واحد"],["zip","ملفات PDF منفصلة (ZIP)"]].forEach(([val,lbl])=>{
    const lab=el("label","fmt"), r=el("input");r.type="radio";r.name="exfmt";r.checked=EX.format===val;
    r.onchange=()=>{EX.format=val;};
    lab.appendChild(r);lab.appendChild(document.createTextNode(lbl));fm.appendChild(lab);
  });
  const go=el("button","act","");go.id="exgo";go.onclick=()=>runExport(go);
  foot.append(fm,go);v.appendChild(foot);
  updateExFoot();
}
async function runExport(btn){
  const sel=exSelected();
  if(!sel.length)return;
  if(typeof html2canvas!=="function"||!window.jspdf){toast("تعذر تحميل أداة الطباعة. أعد فتح الصفحة.",4000);return;}
  const zipMode=EX.format==="zip"&&sel.length>1;
  if(zipMode&&!window.JSZip){toast("تعذر تحميل أداة الضغط. اختر ملف PDF واحد.",4000);return;}
  btn.disabled=true;
  try{
    let blob,filename;
    if(zipMode){
      const zip=new JSZip();
      for(let i=0;i<sel.length;i++){
        toast("تجهيز الملف "+(i+1)+" من "+sel.length);
        const b=await buildPdfBlob([sel[i]]);
        zip.file(sel[i][0].name+" - الدرس "+sel[i][1].no+" - الأسبوع "+sel[i][1].week+".pdf",b);
      }
      blob=await zip.generateAsync({type:"blob"});
      filename=exName(sel)+".zip";
    }else{
      blob=await buildPdfBlob(sel,i=>toast(sel.length>1?("تجهيز الملف "+(i+1)+" من "+sel.length):"تجهيز الملف"));
      filename=exName(sel)+".pdf";
    }
    const dl=await getDownloads();
    if(!dl){toast("التحميل غير متاح في هذا العرض. افتح الصفحة من claude.ai.",5000);return;}
    $("toast").classList.remove("on");
    await dl.save({filename,data:blob});
    toast("تم التحميل",2500);
  }catch(e){
    const code=e&&e.code;
    if(code==="declined")toast("أُلغي التحميل",2500);
    else if(code==="rate_limited")toast("نافذة تحميل مفتوحة بالفعل، انتظر قليلا",3500);
    else if(code==="extension_not_enabled"||code==="rejected_extension")toast("هذا النوع من الملفات غير متاح هنا، اختر ملف PDF واحد",4500);
    else toast("تعذر إنشاء الملف",3500);
  }finally{btn.disabled=false;updateExFoot();}
}

function route(){
  const h0=decodeURIComponent(location.hash.replace(/^#/,""));
  if(h0==="export"||h0.indexOf("export-")===0){viewExport(h0.slice(7));window.scrollTo(0,0);return;}
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  const m=h.match(/^([a-z]+)(?:-(\d+))?$/);
  const s=m&&SUBJECTS.find(x=>x.id===m[1]);
  if(!s){viewHome();}
  else if(m[2]){const l=lessonsOf(s).find(x=>x.no===+m[2]); (l&&l.t)?viewLesson(s,l):viewSubject(s);}
  else viewSubject(s);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();

function allPairs(){const out=[];SUBJECTS.forEach(s=>lessonsOf(s).filter(x=>x.t).forEach(l=>out.push([s,l])));return out;}

let toastT;

let downloadsP=null;
function getDownloads(){
  if(!downloadsP){downloadsP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);}
  /* hors claude.ai (GitHub Pages) : téléchargement classique du navigateur */
  downloadsP=downloadsP.then(d=>d||{save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);}});
  return downloadsP;
}

  body.appendChild(el("div","pf",ROOT_TITLE));
  stage.append(head,body);
  const branchEls=[...body.querySelectorAll(".root-c > .n")];
  const br0=body.getBoundingClientRect();
  const geo=branchEls.map(n=>{const r=n.getBoundingClientRect();return {h:r.height*2};});
  if(keep)branchEls.forEach((n,i)=>{if(!keep.includes(i))n.remove();});
  head.style.width=body.offsetWidth+"px";
  try{
    const br=body.getBoundingClientRect();

      if(d<=4)cuts.push(Math.round((n.getBoundingClientRect().top-br.top-4)*2));
    });
    cuts.sort((a,b)=>a-b);
    const opts={scale:2,backgroundColor:"#ffffff",logging:false};
    const hc=await html2canvas(head,opts);
    const bc=await html2canvas(body,opts);
    return {hc,bc,cuts,geo};
  } finally { head.remove(); body.remove(); }
}

const KN=0.1323, MINK=0.62*KN, MAXK=1.1*KN;
function planFor(land,cw,th){
  const pw=land?297:210,ph=land?210:297,m=8,uw=pw-2*m,uh=ph-2*m;
  const kW=uw/cw,kH=uh/th;
  return {land,pw,ph,m,uw,uh,kW,kH,k1:Math.min(kW,kH)};
}
function newPage(pdf,first,land){
  const orient=land?"landscape":"portrait";
  if(first.v){pdf.v=new window.jspdf.jsPDF({orientation:orient,unit:"mm",format:"a4",compress:true});first.v=false;}
  else pdf.v.addPage("a4",orient);
}
function drawPaper(pdf,first,r,pl){
  const {hc,bc,cuts}=r, cw=bc.width;
  const {m,uh}=pl;
  const pagesAt=t=>Math.ceil((bc.height*t)/(uh-hc.height*t)-0.001);
  let k=Math.min(pl.kW,MAXK), n=pagesAt(k);
  if(n>1){for(let t=k-0.01*KN;t>=MINK;t-=0.01*KN){if(pagesAt(t)<n){k=t;n=pagesAt(t);break;}}}
  const iw=cw*k, x=(pl.pw-iw)/2, headMM=hc.height*k;
  if(n<=1){
    newPage(pdf,first,pl.land);
    pdf.v.addImage(hc.toDataURL("image/jpeg",0.93),"JPEG",x,m,iw,headMM);
    pdf.v.addImage(bc.toDataURL("image/jpeg",0.93),"JPEG",x,m+headMM,iw,bc.height*k);
    return;
  }
  const cap=Math.floor((uh-headMM)/k);
  let start=0;
  while(start<bc.height){
    let end=Math.min(bc.height,start+cap);
    if(end<bc.height){
      const min=start+cap*0.4;let best=-1;
      for(const y of cuts){if(y>min&&y<=end)best=y;}
      if(best>0)end=best;
    }
    const sl=document.createElement("canvas");sl.width=cw;sl.height=end-start;
    const cx=sl.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,sl.width,sl.height);
    cx.drawImage(bc,0,start,cw,end-start,0,0,cw,end-start);
    newPage(pdf,first,pl.land);
    pdf.v.addImage(hc.toDataURL("image/jpeg",0.93),"JPEG",x,m,iw,headMM);
    pdf.v.addImage(sl.toDataURL("image/jpeg",0.93),"JPEG",x,m+headMM,iw,(end-start)*k);
    start=end;
  }
}
/* regroupe les branches principales en pages: chaque page garde la racine */
function groupBranches(r,pl){
  const k=Math.min(pl.kW,Math.max(MINK,0.75*KN));
  const capBody=pl.uh/k-r.hc.height-190;
  const groups=[];let cur=[],h=0;
  r.geo.forEach((g,i)=>{
    const add=g.h+(cur.length?32:0);
    if(cur.length&&h+add>capBody){groups.push(cur);cur=[];h=0;}
    cur.push(i);h+=g.h+(cur.length>1?32:0);
  });
  if(cur.length)groups.push(cur);
  const pages=groups.reduce((a,gr)=>a+Math.max(1,Math.ceil((gr.reduce((x,i)=>x+r.geo[i].h,0)+32*(gr.length-1)+190)/capBody)),0);
  return {groups,pages,k};
}

async function buildPdfBlob(pairs,onStep){
  await document.fonts.ready;
  const pdf={v:null}, first={v:true};
  for(let i=0;i<pairs.length;i++){
    if(onStep)onStep(i);
    const [s,l]=pairs[i];
    const full=await renderPaper(s,l,null);
    const cw=full.bc.width, th=full.hc.height+full.bc.height;
    const L=planFor(true,cw,th), P=planFor(false,cw,th);
    const fits=[L,P].filter(x=>x.k1>=MINK).sort((a,b)=>b.k1-a.k1);
    if(fits.length){drawPaper(pdf,first,full,fits[0]);continue;}
    const opts=[L,P].map(pl=>({pl,g:groupBranches(full,pl)})).filter(o=>Math.min(o.pl.kW,MAXK)>=MINK);
    if(!opts.length){drawPaper(pdf,first,full,L.kW>=P.kW?L:P);continue;}
    opts.sort((a,b)=>a.g.pages-b.g.pages||(b.pl.land-a.pl.land));
    const best=opts[0];
    if(best.g.groups.length===1){drawPaper(pdf,first,full,best.pl);continue;}
    for(const grp of best.g.groups){
      const part=await renderPaper(s,l,grp);
      drawPaper(pdf,first,part,best.pl);
    }
  }
  return pdf.v.output("blob");
}

async function exportPdf(pairs,filename,btn){
  if(!pairs.length)return;
  if(typeof html2canvas!=="function"||!window.jspdf){toast("تعذر تحميل أداة الطباعة. أعد فتح الصفحة.",4000);return;}
  btn.disabled=true;
  try{
    const blob=await buildPdfBlob(pairs,i=>toast(pairs.length>1?("تجهيز الملف "+(i+1)+" من "+pairs.length):"تجهيز الملف"));
    const dl=await getDownloads();
    if(!dl){toast("التحميل غير متاح في هذا العرض. افتح الصفحة من claude.ai.",5000);return;}
    $("toast").classList.remove("on");
    await dl.save({filename,data:blob});
    toast("تم التحميل",2500);
  }catch(e){
    const code=e&&e.code;
    if(code==="declined")toast("أُلغي التحميل",2500);
    else if(code==="rate_limited")toast("نافذة تحميل مفتوحة بالفعل، انتظر قليلا",3500);
    else toast("تعذر إنشاء الملف",3500);
  }finally{btn.disabled=false;}
}
